<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0f16">
  <meta name="description" content="SCRAP & GUN — build, defend, survive.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>SCRAP &amp; GUN — Enhanced</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="720" aria-label="SCRAP & GUN game canvas"></canvas>
    <div id="scan"></div>
    <div id="vig"></div>
  </div>
  <div id="rotate" hidden>
    <div class="rot-icon" aria-hidden="true"></div>
    <h1>Rotate your device</h1>
    <p>SCRAP &amp; GUN plays in landscape.</p>
    <button id="rotateSkip" type="button">Continue in portrait</button>
  </div>
  <script>
/* Force a service-worker update check on load and reload once when a new worker takes over, so a
   released build is never masked by a stale cache. */
(function(){
  if(!('serviceWorker' in navigator))return;
  var reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(reloaded)return;reloaded=true;location.reload();
  });
  window.addEventListener('load',function(){
    navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update().catch(function(){});}).catch(function(){});
  });
})();
</script>
  <script src="game.min.js?v=6"></script>
</body>
</html>
